*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);

footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--baseline);

<script>
const D = {"meta":{"generated":"2026-07-27T17:03:10Z","smoke":false,"runtime_s":456.0,"durations":{"02-normalize":77.9,"03-langid":62.5,"04-quality-heuristics":22.0,"04b-quality-classifier":54.0,"05-dedup":52.9,"06-pii":56.6,"07-decontaminate":70.3,"08-manifest":59.8}},"counts":{"pipeline_stages":8,"named_strategies":9,"techniques":30,"cross_cutting_concerns":8,"why":"Eight is the pipeline map and the instructor's stated minimum. Nine is the union of that map with the session's own closing list, which drops Extract and promotes format discipline. Thirty is the count of distinct named techniques inside those stages, most of which live only in the widgets.","instructor_quote":"Asked whether the eight sections were all that was required: “This is a minimal set… This is the minimum that you have to do.”","list_a":["Extract","Normalize","Language ID","Quality filter","Deduplicate","PII scrub","Decontaminate","Manifest"],"list_b":["Normalization","Format discipline","Quality filtering","Deduplication","Language validation","PII removal","Decontamination","The manifest"],"union_note":"List A has Extract and folds format discipline inside Normalize. List B drops Extract and makes format discipline first-class. Nine distinct strategies between them."},"stages":[{"n":1,"key":"extract","name":"Extract","session_kept":92,"what":"Turn raw HTML into clean prose: pull the article body out of the page and drop everything around it.","why":"Every page of a site repeats its header, menu, footer and legal boilerplate. Training on that is pure waste, and naive HTML stripping keeps it as if it were content.","v4_defect":"Extraction quality was compared in Session 3: naive stripping keeps nav and legal text as content.","applied":"inherited","applied_note":"Sangraha ships extracted text, and extraction was Session 3's stage. Accounted for at 100% here rather than re-run, and labelled as inherited everywhere it appears."},{"n":2,"key":"normalize","name":"Normalize","session_kept":88,"what":"NFC unicode normalization, HTML unescaping, removal of the replacement character, stripping of control / zero-width / bidi / BOM characters, whitespace collapse — and preservation of ZWNJ and ZWJ.","why":"A byte-level tokenizer sees every stray character, so an uncleaned corpus spends permanent vocabulary slots on zero-width spaces and broken byte fragments. But ZWNJ (U+200C) and ZWJ (U+200D) are legitimate Brahmic script controls: a cleaner that strips all invisible characters corrupts Indic text while believing it is helping.","v4_defect":"V4 had no clean_text() in any of its six ingestion scripts, which produced 46 garbage vocab tokens (18 zero-width, 20 broken utf-8, 4 HTML artifact, 4 private-use) plus ghost tags baked into the data.","applied":"yes"},{"n":3,"key":"format","name":"Format discipline","session_kept":null,"what":"Detect conversation markers written into the text as ordinary characters, and rewrite every source into one canonical format using the tokenizer's real special tokens.","why":"During pretraining the model learns literal markers as ordinary subwords; during SFT it meets the real special tokens, and holds two competing ideas of what a conversation looks like. The audit measured the waste at 15 pretrain tokens where 10 were wanted, and 23 where 8 were wanted.","v4_defect":"Four sources arrived in four incompatible formats and none used the tokenizer's real special tokens — the P0 root cause. The audit found [USER] x6, [SYSTEM] x2 and <|endoftext|> x3 inside the pretraining shards.","applied":"yes","applied_note":"Folded inside Normalize by the pipeline map; counted separately here because the session's own closing list makes it first-class."},{"n":4,"key":"langid","name":"Language ID and validation","session_kept":61,"what":"Detect the language of every document at runtime and validate it against the code its source claims. Quarantine mismatches; flag code-switched and romanised documents rather than shipping them into one bucket.","why":"Web-crawled data is mislabelled often enough that trusting the path pollutes the per-language pools. A Bengali document counted as Assamese inflates the Assamese total and starves the Bengali one, so every downstream sampling decision is computed on a corrupted denominator.","v4_defect":"V4 trusted the folder name (verified/asm/) with no runtime detection. Telugu was coded te where the pipeline expected tel, and only worked because a fallback happened to return the right value — the kind of bug that is most dangerous, the kind that works.","applied":"yes"},{"n":5,"key":"quality","name":"Quality filtering","session_kept":44,"what":"A cascade of nine Gopher/C4 heuristic rules, then a trained classifier scoring educational value 0–5, keeping documents at or above 3.0.","why":"Most of the web is not worth training on. But filtering is not a neutral cleaning step — it is a decision about which languages the model will be able to speak, and a chain of rules tuned on English scores much of the low-resource web as garbage.","v4_defect":"V4's OPUS selector used an English-heavy proxy that systematically under-valued Indic text, which forced an Always-ON bypass just to stop it discarding good Indic data.","applied":"yes"},{"n":6,"key":"dedup","name":"Deduplication","session_kept":43,"what":"Exact content-hash dedup, then near-duplicate detection: shingle each document, reduce to a MinHash signature, band the signatures with LSH to find candidates, confirm against true Jaccard. Then do it again globally rather than per shard.","why":"The naive picture — dropping identical documents — misses almost all real duplication, which is near-identical reposts. And duplication is global: two contributors can each dedup their own shard perfectly and still leave a document that appears in both.","v4_defect":"Sangraha, the Indic web crawl, had zero deduplication at any level. The audit flagged it as both wasted compute and a memorization risk at scale.","applied":"yes"},{"n":7,"key":"pii","name":"PII removal","session_kept":42,"what":"A regex layer for structured identifiers (emails, phones, IPs, national ids, credentials) and a name layer for the things that have no fixed shape.","why":"It matters for the people whose data would otherwise sit in the corpus and for the legal usability of the corpus itself. The two layers have two different failure modes: regex is near-exact, while the name layer trades precision against recall — and that trade is sharper for Indic, where place names and given names overlap.","v4_defect":"Dolma ran regex PII scrubbing; the Indic pipeline had none, so identifiers passed straight through into the training set.","applied":"yes"},{"n":8,"key":"decontaminate","name":"Decontamination","session_kept":42,"what":"Fingerprint the evaluation sets as n-grams, scan every shard against those fingerprints, remove any training document that overlaps a test example, and plant canary strings so a later leak is still detectable.","why":"It protects every number the project will ever report. Leaking the held-out set into training moved a reported benchmark score from 41% to 88% in the session's own demonstration.","v4_defect":"V4 kept a Golden Proxy of the test splits (6.8M tokens, 11 shards) that was never trained on, so decontamination could be verified rather than assumed. Band B2 was dropped once it showed 18.7% leakage.","applied":"yes"},{"n":9,"key":"manifest","name":"Manifest and provenance","session_kept":42,"what":"Emit per-shard provenance — source, licence, contributor, every cleaning script and its source hash, ingest timestamp, sha256, measured token count, language distribution — and gate on it. Identifiers derive from content, so the same input reproduces them.","why":"A clean corpus is only trustworthy if you can say where every part came from and reproduce it on demand. The manifest is the datasheet published with the corpus and the audit trail behind the paper, and it is what the gating rule enforces: a contribution that cannot produce a manifest has not shipped clean data.","v4_defect":"V4 copy-pasted dataset sizes and built ids from row_number() over a non-deterministic ordering, so the same input produced different ids every run. Its token estimate of words x 1.3 was wrong for Indic by 2–10x.","applied":"yes"}],"techniques":[{"name":"Article-body extraction","stage":"extract","what":"Keep the article, drop nav/footer/cookie banners.","status":"inherited"},{"name":"NFC unicode normalization","stage":"normalize","what":"One canonical encoding per character. NFC, not NFKC — the session is explicit.","status":"applied"},{"name":"Control / C0-C1 stripping","stage":"normalize","what":"Remove control bytes that carry no meaning.","status":"applied"},{"name":"Zero-width and BOM stripping","stage":"normalize","what":"ZWSP, word joiner, soft hyphen, BOM — pure noise.","status":"applied"},{"name":"Bidi override stripping","stage":"normalize","what":"LRM/RLM/LRO/RLO reverse reading order and corrupt text.","status":"applied"},{"name":"ZWNJ / ZWJ preservation","stage":"normalize","what":"U+200C and U+200D are legitimate Brahmic controls and are always kept. This is the rule that separates a cleaner built for these languages from one that was not.","status":"applied"},{"name":"HTML entity unescaping","stage":"normalize","what":"&amp; becomes &, so the tokenizer never learns the escape.","status":"applied"},{"name":"U+FFFD removal","stage":"normalize","what":"The replacement character marks a byte that failed to decode.","status":"applied"},{"name":"Whitespace collapse","stage":"normalize","what":"Runs of whitespace become one space.","status":"applied"},{"name":"Hash after cleaning","stage":"normalize","what":"sha256 is computed on the cleaned text, so two documents differing only in invisible junk dedupe to the same hash. Dedup and the manifest both trust this ordering.","status":"applied"},{"name":"Ghost special-token flagging","stage":"format","what":"Literal [USER] / <|endoftext|> / ### Instruction: markers are flagged, never silently deleted.","status":"applied"},{"name":"Canonical format unification","stage":"format","what":"Every source's role markers rewritten to one canonical <|user|> / <|assistant|> form.","status":"applied"},{"name":"Runtime language detection","stage":"langid","what":"fastText lid.176 on every document, never the folder path.","status":"applied"},{"name":"Language-code normalization","stage":"langid","what":"ISO 639-1 to 639-3 mapping — the te / tel bug, fixed rather than survived by accident.","status":"applied"},{"name":"Code-switch and romanisation flagging","stage":"langid","what":"Script-mix profiling separates code-switched and Latin-script Indic documents from clean monolingual ones.","status":"applied"},{"name":"Gopher/C4 heuristic cascade","stage":"quality","what":"Nine rules at the session's exact thresholds.","status":"applied"},{"name":"Script-aware thresholds","stage":"quality","what":"Per-language stop-word lists, per-script word-count floors and mean-word-length bands, and the danda as a sentence terminator.","status":"applied"},{"name":"Trained classifier gate","stage":"quality","what":"Weak structural labels train a fastText model that scores educational value 0–5; keep at 3.0. The session's recipe with a heuristic labeller in place of an LLM.","status":"applied-substitute"},{"name":"Exact content-hash dedup","stage":"dedup","what":"Identical cleaned text collapses to one document.","status":"applied"},{"name":"Shingling","stage":"dedup","what":"Overlapping k-word shingles turn a document into a set.","status":"applied"},{"name":"MinHash signatures","stage":"dedup","what":"Fixed-length signatures whose agreement rate estimates the true Jaccard.","status":"applied"},{"name":"LSH banding","stage":"dedup","what":"Bands and rows tuned so the S-curve inflects just below the drop threshold.","status":"applied"},{"name":"Global vs. local dedup","stage":"dedup","what":"Per-shard passes run alongside one global pass, to measure what only the global pass catches.","status":"applied"},{"name":"PII regex layer","stage":"pii","what":"Emails, Indian phone formats, IPv4, Aadhaar-shaped ids, PAN, GSTIN, credentials.","status":"applied"},{"name":"PII name layer","stage":"pii","what":"Gazetteer plus context gating, with a place-name exclusion list, scored across an aggressiveness dial.","status":"applied-substitute"},{"name":"n-gram decontamination","stage":"decontaminate","what":"13-gram fingerprints of the held-out eval sets, including Indic ones.","status":"applied"},{"name":"Canary strings","stage":"decontaminate","what":"Minted, planted in a probe shard, recovered by scan, and confirmed absent from the shipped corpus.","status":"applied"},{"name":"Manifest provenance and licence gating","stage":"manifest","what":"Eleven required fields, a licence allow-list, and an admit/block verdict per shard.","status":"applied"},{"name":"Deterministic content-derived ids","stage":"manifest","what":"Re-running the pipeline reproduces every shard id and hash byte for byte.","status":"applied"},{"name":"Measured token counts","stage":"manifest","what":"A named tokenizer, with per-language fertility reported — never words x 1.3.","status":"applied"}],"concerns":[{"name":"Filter bias against low-resource scripts","status":"handled","detail":"The central finding of this run. The nine rules were executed twice, English-tuned and script-aware, and the gap between them measured per language."},{"name":"Licence and attribution","status":"handled","detail":"Sangraha is CC-BY-4.0: shippable with an attribution obligation, which is recorded on every shard and checked against an allow-list before admission. The session's own caution stands — a project wanting an MIT-licensed model should not train on it."},{"name":"Determinism and reproducibility","status":"handled","detail":"Source revision pinned, ids derived from content, timestamps derived from input rather than wall clock, and a two-run assert that shard ids and hashes come back byte-identical."},{"name":"Memorisation risk from duplication","status":"handled","detail":"Near-duplicate removal at Jaccard 0.67, the transcript's stated threshold, with the local-versus-global gap measured rather than assumed."},{"name":"Undeclared machine-translated content","status":"flagged","detail":"Roughly 65% of Sangraha is machine-translated or synthetic, and the split it sits in does not say which documents. Detecting translationese is out of scope here; the risk is recorded on the datasheet instead of being quietly inherited."},{"name":"Toxicity and values filtering","status":"deferred","detail":"Deferred deliberately, matching the session: asked whether the quality cascade handles political or ideological bias, the answer was “Not yet — the LLM-labelled classifier needs to kick in here.” Doing it with a keyword list would be worse than not doing it."},{"name":"Malicious and poisoned data","status":"deferred","detail":"An acknowledged gap in the session too — no stage owns it, and the answer given was that the cohort has to write that script itself. Named here rather than left implied."},{"name":"Code-aware cleaning","status":"not-applicable","detail":"Whitespace must never be collapsed in code, and licence headers should go while code comments stay. This slice is prose, so the rule is stated but not exercised; a code pool would need a separate cleaner."}],"rationale":[{"stat":"Per-stage survival, in documents and tokens","why":"A cleanup is a sequence of decisions to discard. The only honest summary is how much each decision discarded and at what point, which is why the descent is reported per stage rather than as one retention figure."},{"stat":"Tokens as well as documents","why":"Documents and tokens do not fall together. A stage that drops many short documents costs little; one that drops a few long ones costs a lot. Reporting only documents hides which is which."},{"stat":"Counterfactual, not just outcome","why":"For the two stages where the design choice is contested — the quality filter and dedup — the alternative was also run: English-tuned versus script-aware, and local versus global. A retention number without its counterfactual cannot tell you whether the filter or the text was broken."},{"stat":"Per-language, never only in aggregate","why":"The whole risk in an Indic corpus is a stage that behaves differently by language. An aggregate keep-rate would have concealed the single largest finding in this run."},{"stat":"Measured, with the measuring instrument named","why":"Token counts come from a named tokenizer with its per-language fertility published, because words x 1.3 is wrong for Indic by 2–10x and that error propagates into every budget."},{"stat":"Negative and near-zero results kept","why":"Stages that found little are reported at what they found. A cleanup report that only lists large numbers is selecting its own evidence."}],"citations":["Session 4 — Data Cleaning and Deduplication (writeup, live transcript, and all 10 interactive widgets)","ai4bharat/sangraha — CC-BY-4.0, revision pinned in the manifest","Gopher (Rae et al. 2021) and C4 (Raffel et al. 2020) heuristic filters","FineWeb-Edu classifier recipe; Llama 3 and DCLM use fastText for the same gate","MinHash (Broder 1997) and LSH banding (Indyk & Motwani 1998)"],"session_yield":[{"stage":"Raw","pct":100},{"stage":"Extract","pct":92},{"stage":"Normalize","pct":88},{"stage":"Language ID","pct":61},{"stage":"Quality filter","pct":44},{"stage":"Deduplicate","pct":43},{"stage":"PII scrub","pct":42},{"stage":"Decontaminate","pct":42},{"stage":"Manifest","pct":42}],"headline":{"dataset":"ai4bharat/sangraha","revision":"8b813c3f62d37b2fa174d68c31e8b35ae2fe85e8","license":"CC-BY-4.0","docs_in":64712,"tokens_in":48008963,"docs_out":60174,"tokens_out":43450641,"doc_retention_pct":92.99,"token_retention_pct":90.51,"shards":13,"shards_admitted":13},"descent":[{"stage":"0. Raw slice","docs":64712,"pct_docs":100.0,"dropped": function bars(items, opts = {}) {
  const max = opts.max ?? Math.max(1, ...items.map(i => i.v));
  const g = el("div", "bars" + (opts.dual ? " dual" : ""));
  items.forEach(it => {
    g.appendChild(el("div", "lb", esc(it.k)));
    const trk = el("div", "trk");
    const b = el("div", "bar " + (it.cls || ""));
    b.style.width = Math.max(0.6, 100 * it.v / max) + "%";
    trk.appendChild(b);
    if (it.ref !== undefined) {
      const r = el("div", "bar ref");
      r.style.width = Math.max(0.6, 100 * it.ref / max) + "%";
      trk.appendChild(r);

  });
  return g;
}

    P.appendChild(el("h3", "", "Documents the English-tuned filter would have thrown away"));
    Q.examples.forEach(e => P.appendChild(box(null,
      `<span class="pill bad">killed by ${e.failed_under_english_rules.map(esc).join(", ")}</span>
       <span class="pill">${n0(e.n_words)} words</span>
       <span class="pill">ASCII terminators ${f1(e.term_ascii_frac * 100)}% · any ${f1(e.term_any_frac * 100)}%</span>
       <div class="ex" style="margin-top:7px">${esc(e.excerpt)}</div>`)));
  }

  /* ---- classifier ---- */
  const C = D.classifier;
  P.appendChild(el("h3", "", "The second layer: a trained classifier gate"));
  if (C.skipped) {
    P.appendChild(box(null, `<p style="margin:0" class="muted">Skipped on this run: the weak-label
      sample was too small or single-class.</p>`));
  } else {
    P.appendChild(tiles([
      { k: "held-out exact accuracy", v: f1(C.acc * 100) + "%" },
      { k: "held-out within-1 accuracy", v: f1(C.acc1 * 100) + "%" },
      { k: "train / test documents", v: n0(C.train) + " / " + n0(C.test) },
      { k: "dropped below score " + C.threshold, v: n0(C.docs_in - C.docs_out) }
    ]));
    P.appendChild(box("What this is, and what it is not", `
      <p style="margin:0">The session's recipe is: a large model labels a small sample for
      educational value, a cheap model learns to imitate those labels, and the cheap model scores
      the corpus. FineWeb-Edu used a BERT head; Llama 3 and DCLM used fastText. There is no GPU here
      and no educational-value labeller for Indic, so the expensive labeller is replaced by
      structural weak labels — boilerplate density, link density, digit density, lexical variety,
      sentence-length regularity — deliberately chosen to be disjoint from the nine rules already
      applied, so the classifier adds signal instead of restating the cascade. Everything
      downstream is the real mechanism. ${esc(C.caveat)}</p>
      <p style="margin:8px 0 0">And it barely bites: the gate dropped
      <strong>${n0(C.docs_in - C.docs_out)}</strong> of ${n0(C.docs_in)} documents, because the
      nine rules upstream have already removed most of what these weak labels would score low.
      Reported as it came out. A genuine LLM-labelled classifier separates <em>ordinary</em> prose
      from <em>educational</em> prose — a judgement structural signals cannot make, and the reason
      FineWeb-Edu paid for the labels.</p>`, "tint"));
    P.appendChild(table(
      [{ label: "Language" }, { label: "Documents", num: true },
       { label: "Mean score / 5", num: true }, { label: "Kept at ≥ " + C.threshold, num: true }],
      Object.entries(C.per_lang).map(([l, v]) => [
        `<code>${esc(l)}</code>`, n0(v.docs), v.mean_score, n0(v.kept)])
    ));
  }

  /* ---- dedup ---- */
  P.appendChild(el("h2", "", "Deduplication: the stage Sangraha skipped"));
  const X = D.dedup;
  P.appendChild(tiles([
    { k: "exact duplicates", v: n0(X.exact), note: n0(X.exact_cross) + " across shards" },
    { k: "near-duplicates", v: n0(X.near), note: n0(X.near_cross) + " across shards" },
    { k: "tokens removed", v: n1(X.tokens_dropped / 1e6) + "M" },
    { k: "LSH candidate pairs", v: n0(X.candidates) },
    { k: "caught only by the global pass", v: n0(X.only_global) },
    { k: "index at 500M docs", v: n1(X.memory.at_500M_docs.resident_gib) + " GiB" }
  ]));
  P.appendChild(table(
    [{ label: "Parameter" }, { label: "This run" }, { label: "Session's simulator" }],
    [
      ["shingle size k", X.config.shingle_k + " words", X.demo.k + " words"],
      ["permutations n", X.config.permutations, X.demo.permutations],
      ["bands × rows", X.config.bands + " × " + X.config.rows_per_band,
        X.demo.bands + " × " + X.demo.rows],
      ["LSH threshold (1/b)^(1/r)", X.config.lsh_threshold, X.demo.lsh_threshold],
      ["drop at true Jaccard ≥", X.config.jaccard_drop_threshold,
        "0.67 <span class='muted'>(stated in class)</span>"],
      ["shingle window", n0(X.config.shingle_window_words) + " words", "—"]
    ],
    { caption: "b and r were chosen so the S-curve inflects at " + X.config.lsh_threshold +
      ", just below the 0.67 drop threshold — the banding stage has to be slightly more permissive " +
      "than the confirmation stage, or it discards true duplicates before they are ever scored." }
  ));

  P.appendChild(box("Sangraha's duplication is verbatim, not paraphrased", `
    <p style="margin:0">${n0(X.exact)} exact duplicates against ${n0(X.near)} near-duplicates: the
    copies in this corpus are byte-identical reposts of the same government and news pages, not
    reworded versions of them. That matters for how the stage should be built — a content hash
    catches almost all of it for almost nothing, and MinHash earns its cost on the remainder rather
    than on the bulk. It is also why the LSH stage evaluated only ${n0(X.candidates)} candidate
    pairs: exact dedup runs first and collapses each large duplicate clique to a single
    representative before banding ever sees it.</p>`, "tint"));

  P.appendChild(box("Local dedup does not produce a deduplicated corpus", `
    <p style="margin:0 0 8px">Each source shard was deduplicated on its own, and then the whole
    slice was deduplicated as one. Per-shard passes caught <strong>${n0(X.local_caught)}</strong>
    duplicates; the single global pass caught <strong>${n0(X.global_caught)}</strong>. The
    <strong>${n0(X.only_global)}</strong> in the gap are documents that appear in two different
    shards, so no contributor working alone could ever see them. That is why the course provisions
    one central dedup machine rather than leaving the stage to each student.</p>
    <p class="muted" style="margin:0"><small>Index memory model, from the session's own arithmetic
    (128 hashes × 8 B × 1.6 overhead): this run needs
    ${n1(X.memory.this_run.resident_gib)} GiB; at 500M documents it needs
    ${n1(X.memory.at_500M_docs.resident_gib)} GiB — a 768 GB node, impossible on a
    laptop.</small></p>`, "tint"));

  if (X.pairs.length) {
    P.appendChild(el("h3", "", "Confirmed duplicate pairs"));
    P.appendChild(table(
      [{ label: "Kept" }, { label: "Dropped" }, { label: "Cross-shard" },
       { label: "True Jaccard", num: true }, { label: "MinHash estimate", num: true },
       { label: "Error", num: true }],
      X.pairs.map(p => [
        `<code class="muted">${esc(p.kept.slice(0, 26))}…</code>`,
        `<code class="muted">${esc(p.dropped.slice(0, 26))}…</code>`,
        p.same_shard ? "—" : '<span class="pill warn">yes</span>',
        p.true_jaccard.toFixed(3), p.minhash_estimate.toFixed(3), p.estimate_error.toFixed(3)
      ]),
      { caption: "The MinHash estimate is what the signature says; the true Jaccard is computed " +
        "from the full shingle sets. The gap between them is the price of the approximation." }
    ));
  }

  /* ---- pii ---- */
  P.appendChild(el("h2", "", "PII: two layers, two failure modes"));
  const I = D.pii;
  P.appendChild(tiles([
    { k: "spans masked", v: n0(I.total) },
    { k: "documents containing PII", v: n0(I.docs_with_pii),
      note: f1(pct(I.docs_with_pii, I.docs_in)) + "% of the corpus" },
    { k: "token count change from masking", v: (I.waste.pct_saved > 0 ? "−" : "+") +
        f1(Math.abs(I.waste.pct_saved)) + "%",
      note: "measured on " + n0(I.waste.docs_measured) + " docs" },
    { k: "place-name exclusions", v: n0(I.layer2.place_name_exclusions) }
  ]));
  P.appendChild(table(
    [{ label: "Class" }, { label: "Layer" }, { label: "Spans masked", num: true }],
    Object.entries(I.by_kind).sort((a, b) => b[1] - a[1]).map(([k, v]) => [
      `<code>${esc(k)}</code>`, k === "NAME" ? "gazetteer + context" : "regex", n0(v)])
  ));

  P.appendChild(el("h3", "", "Precision and recall, and the false-positive trap"));
  P.appendChild(el("p", "muted", `<small>${esc(I.scoring_note)} ${n0(I.fixture_spans)} true spans
    and ${n0(I.fixture_traps)} traps annotated across ${I.per_case.length} cases.</small>`));
  P.appendChild(table(
    [{ label: "Aggressiveness dial", num: true }, { label: "Precision", num: true },
     { label: "Recall", num: true }, { label: "F1", num: true },
     { label: "False positives", num: true }, { label: "Traps wrongly masked", num: true }],
    I.curve.map(c => [
      c.aggressiveness.toFixed(2), c.precision, c.recall, c.f1,
      n0(c.false_positives), n0(c.trap_spans_wrongly_masked)
    ]),
    { caption: "Below 0.60 the exclusion list protects place names, deities and public figures. " +
      "Above it the name layer fires on weaker signals: recall does not improve, precision falls, " +
      "and it starts masking a city. That is the trade, measured." }
  ));
  P.appendChild(box("The part a gazetteer cannot fix", `
    <p style="margin:0">${esc(I.public_figure_caveat)}</p>`, "tint"));
  if (I.waste.pct_saved <= 0) {
    P.appendChild(box("A result that came out the other way", `
      <p style="margin:0">The session measures PII masking as a compute saving — 81 tokens down to
      48 on its worked example, about 40%. On this corpus masking made the text
      <strong>${f1(Math.abs(I.waste.pct_saved))}% longer</strong> in tokens, not shorter. The reason
      is what gets replaced: the session's example is dominated by long email addresses and phone
      numbers, which are token-expensive, whereas ${f1(pct(I.by_kind.NAME || 0, I.total))}% of what
      fired here is <code>NAME</code> — short Devanagari or Telugu words replaced by the seven-token
      ASCII placeholder <code>[NAME]</code>. Masking is a privacy measure; the compute saving is
      incidental to it and does not survive a change of corpus.</p>`, "tint"));
  }

  /* ---- decontamination ---- */
  P.appendChild(el("h2", "", "Decontamination and canaries"));
  const T = D.decontaminate;
  P.appendChild(tiles([
    { k: T.n + "-gram fingerprints", v: n0(T.ngrams) },
    { k: "documents dropped", v: n0(T.dropped),
      note: (T.rate * 100).toFixed(4) + "% of the corpus" },
    { k: "canary recovered by scan", v: T.canary.detector_works ? "yes" : "no" },
    { k: "canaries in shipped corpus", v: n0(T.canary.canaries_found_in_shipped_corpus ?? 0) }
  ]));
  P.appendChild(table(
    [{ label: "Evaluation set" }, { label: "Split" }, { label: "Examples", num: true },
     { label: "n-grams contributed", num: true }, { label: "Hits in corpus", num: true }],
    Object.entries(T.eval_sets).map(([k, v]) => [
      esc(k) + " <code class='muted'>" + esc(v.repo) + "</code>", esc(v.split),
      n0(v.examples_loaded), n0(v.new_ngrams), n0(T.by_set[k] || 0)]),
    { caption: "Indic benchmarks are included deliberately: scanning an Indic corpus against " +
      "English evaluations only would declare it clean by construction." }
  ));
  P.appendChild(box("A near-zero result, reported as one", `
    <p style="margin:0">Contamination came out at ${(T.rate * 100).toFixed(4)}%. That is a real
    finding, not a failed stage: a general web crawl has little reason to contain benchmark items
    verbatim, and a document needs ${T.min_hits} distinct matching ${T.n}-grams before it is
    dropped. The stage earns its place by being verifiable — the canary demonstration shows the
    detector fires when there is something to find.</p>`, "tint"));

  /* ---- manifest ---- */
  P.appendChild(el("h2", "", "Manifest, provenance and determinism"));
  const MA = D.manifest;
  P.appendChild(tiles([
    { k: "shards emitted", v: n0(MA.shards) },
    { k: "admitted by the gate", v: n0(MA.admitted) + " / " + n0(MA.shards) },
    { k: "cleaning scripts hashed", v: n0(MA.scripts.length) },
    { k: "tokens measured", v: n1(MA.tokens / 1e6) + "M" },
    { k: "words × 1.3 would claim", v: n1(MA.naive / 1e6) + "M",
      note: (MA.naive_err > 0 ? "+" : "") + MA.naive_err + "% error" },
    { k: "ids reproduce across runs", v: MA.determinism.identical ? "yes" : "no" }
  ]));
  P.appendChild(el("h3", "", "A real emitted manifest"));
  P.appendChild(el("pre", "", esc(JSON.stringify(MA.example, null, 2))));
  P.appendChild(box("The gate blocks as well as admits", `
    <p style="margin:0">Removing one required field —
    <code>${esc(MA.blocked_example.what_was_removed)}</code> — from that same manifest flips it to
    <strong>${esc(MA.blocked_example.status)}</strong>:
    <em>${esc(MA.blocked_example.gate_reasons.join("; "))}</em>. A contribution that cannot produce
    a manifest has not shipped clean data.</p>
    <p class="muted" style="margin:8px 0 0"><small>${esc(MA.determinism.contrast)}</small></p>`,
    "tint"));
}

/* ================================================================ 5 CONCERNS */
{
  const P = $("#p-concerns");
  P.appendChild(el("h2", "", "Other strategies and concerns"));
  P.appendChild(el("p", "", `Everything below is outside the eight numbered stages. Each is marked
    with what was actually done — including the ones deliberately not done, with the reason, because
    a cleanup report that lists only its successes is selecting its own evidence.`));
  D.concerns.forEach(c => P.appendChild(box(c.name,
    `${STATUS_PILL[c.status] || esc(c.status)}
     <p style="margin:8px 0 0">${esc(c.detail)}</p>`)));
}

/* ================================================================ 6 STATS */
{
  const P = $("#p-stats");
  P.appendChild(el("h2", "", "Final statistics"));

  P.appendChild(table(
    [{ label: "Measure" }, { label: "Value", num: true }],
    [
      ["Documents in", n0(H.docs_in)],
      ["Documents shipped", n0(H.docs_out)],
      ["Document retention", f1(H.doc_retention_pct) + "%"],
      ["Tokens in <span class='muted'>(" + esc(D.manifest.tokenizer) + ")</span>", n0(H.tokens_in)],
      ["Tokens shipped", n0(D.manifest.tokens)],
      ["Token retention", f1(H.token_retention_pct) + "%"],
      ["Words shipped", n0(D.manifest.words)],
      ["Shards emitted / admitted", n0(D.manifest.shards) + " / " + n0(D.manifest.admitted)],
      ["Total runtime", f1(M.runtime_s / 60) + " min"]
    ]
  ));

  P.appendChild(el("h3", "", "Tokens shipped, by language"));
  const byLang = Object.entries(D.manifest.by_lang).sort((a, b) => b[1] - a[1]);
  P.appendChild(bars(byLang.map(([k, v]) => ({ k, v, cls: "b2", label: n0(v) }))));

  P.appendChild(el("h3", "", "Fertility: why words × 1.3 is not a token count"));
  P.appendChild(el("p", "muted", `<small>Measured tokens per word, per language, with
    <code>${esc(D.manifest.tokenizer)}</code>. V4 estimated tokens as words × 1.3, and the session
    flags that as wrong for Indic by 2–10×. Across this slice the error is
    <strong>${D.manifest.naive_err}%</strong>.</small>`));
  const fert = Object.entries(D.manifest.fertility).sort((a, b) => b[1] - a[1]);
  const fertMax = Math.max(1.4, ...fert.map(f => f[1]));
  P.appendChild(bars(fert.map(([k, v]) => ({
    k, v, cls: "b3", label: v.toFixed(2) + " tok/word  (" + (v / 1.3).toFixed(1) + "× the assumed 1.3)"
  })), { max: fertMax, refLine: 1.3 }));
  P.appendChild(box(null, `<p style="margin:0" class="muted"><small>The dashed line is 1.30 — the
    ratio V4 applied to every language alike. Assamese needs
    ${fert.length ? (fert[0][1] / 1.3).toFixed(1) : "—"}× that, so a budget built on the flat ratio
    under-counts the tokens actually required and every downstream language allocation inherits the
    error.</small></p>`, "tint"));

  P.appendChild(el("h2", "", "Why these statistics"));
  P.appendChild(el("p", "", `Choosing the statistics is part of the exercise, so here is the
    reasoning rather than just the numbers.`));
  P.appendChild(table(
    [{ label: "What is reported" }, { label: "Why" }],
    D.rationale.map(r => [`<strong>${esc(r.stat)}</strong>`, esc(r.why)])
  ));
}

/* ---------------------------------------------------------------- footer */
$("#foot").innerHTML =
  `<p style="margin:0 0 4px">Vardhan Walavalkar · ERA V5 Session 4 · generated
   ${esc(M.generated)} from <code>data/run/stats.json</code>. Every figure on this page is emitted
   by the pipeline; none is typed by hand.</p>
   <ul>${D.citations.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;

/* ---------------------------------------------------------------- theme + hash */
const btn = $("#themeBtn");
btn.onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};
function openFromHash() {
  const t = [...nav.querySelectorAll(".tab")]
    .find(b => b.getAttribute("aria-controls") === "p" + location.hash.replace("#", "-"));
  if (t) t.click();
}
openFromHash();
addEventListener("hashchange", openFromHash);
</script>
</body>
</html>
